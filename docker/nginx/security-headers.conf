# Cabeceras de seguridad del Bingo Sorpresa.
#
# Van en un fichero aparte porque nginx NO acumula `add_header`: en cuanto un `location` declara
# uno propio (aquí todos lo hacen, para el Cache-Control), los `add_header` del bloque `server`
# dejan de aplicarse en ese location. Se incluye este fichero en cada location para que valgan.

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# CSP:
#  - login con Google (GIS): script, estilo, iframe y fetch de https://accounts.google.com; sin él
#    el botón no aparece y la consola solo da un aviso de CSP;
#  - avatar de Google en img-src (lh3.googleusercontent.com). Las fotos de los bingos son
#    mismo origen (/img.php) y la API también (/api);
#  - canciones de YouTube (IFrame Player API): script-src necesita los DOS, www.youtube.com (el
#    bootstrap iframe_api) y s.ytimg.com (el bundle del widget); sin el segundo «no suena y no da
#    errores». El iframe sale de www.youtube-nocookie.com (y www.youtube.com por si acaso) en
#    frame-src y en child-src (WebViews viejas, que no conocen frame-src; lleva también Google para
#    no romper el login en ellas). Las miniaturas, de i.ytimg.com en img-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: https://lh3.googleusercontent.com https://i.ytimg.com; media-src 'self' blob:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com https://www.youtube-nocookie.com https://www.youtube.com; child-src https://accounts.google.com https://www.youtube-nocookie.com https://www.youtube.com;" always;
