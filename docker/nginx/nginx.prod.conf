server {
    listen 80;
    server_name bingo.dcahomelab.com;
    root /usr/share/nginx/html;
    index index.html;

    # Subida de fotos por multipart a /api: 10 MB por fichero + sobrecarga (= post_max_size 12M del
    # backend). Sin esto nginx corta a 1 MB con un 413 antes de llegar a PHP.
    client_max_body_size 12m;

    # Cloudflare real IP configuration
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    # cloudflared llega por la red Docker bingo_prod, no desde una IP de Cloudflare: sin esto,
    # $remote_addr es la del túnel para todos y los rate limits por IP del backend son globales.
    # Rangos de Docker enteros para sobrevivir a que la red se recree con otra subred.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    # Gzip (texto; los MP3/fotos NO se comprimen).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript image/svg+xml;

    # Proxy del endpoint único del backend. El frontend postea a /api
    # (exacto); se reescribe a /index.php (la acción va en el body).
    location /api {
        rewrite ^/api/?$ /index.php break;
        proxy_pass http://backend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        include /etc/nginx/security-headers.conf;
    }

    # Fotos privadas de los bingos (binario, fuera del router), autenticadas por URL firmada.
    location = /img.php {
        proxy_pass http://backend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        gzip off;
        include /etc/nginx/security-headers.conf;
    }

    # Assets con hash: cacheables agresivamente (el hash invalida en cada deploy).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
        access_log off;
    }

    # SPA (hash router). El resto cae en index.html; el HTML no se cachea para ver los deploys.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
    }

    # Cabeceras de seguridad: definidas en security-headers.conf e incluidas dentro de cada
    # location (nginx descarta los add_header del server en cuanto el location declara los suyos).

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
